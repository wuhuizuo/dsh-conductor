name: Bug report
description: Report a defect in a Conductor command, the agent preset, or the packaged assets.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please include the exact
        command you ran and the full error text — Conductor returns actionable
        error results for broken installs.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Output of `dsh --version`.
      placeholder: 0.2.1-rc.5
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.14.0
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: dsh-conductor version
      description: Version reported by `dsh plugin --profile <profile> why @wuhuizuo/dsh-conductor` or the npm page.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the profile name and whether the bundle was installed with `dsh plugin add`, the plugin manager, or a local tarball.
      placeholder: |
        1. `dsh plugin --profile web add @wuhuizuo/dsh-conductor`
        2. Restart DSH, select the Conductor preset
        3. Run `/conductor-new-track "add login"`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Paste the command result and, for activation failures, the boot warning naming the failing plugin row.
      render: shell
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project context (optional)
      description: The `conductor/` layout helps for workflow bugs. Do not paste secrets or proprietary source.
      placeholder: |
        conductor/setup_state.json: {"last_successful_step": "3.3_initial_track_generated"}
        conductor/tracks/...
    validations:
      required: false
