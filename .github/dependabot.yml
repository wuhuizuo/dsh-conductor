version: 2

# Keep the dev-only toolchain (eslint, prettier, typescript, vitest, @types/node)
# and the GitHub Actions pinned to current releases. All dependencies here are
# development-only: the published bundle has no runtime dependencies.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      npm-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are reviewed by a maintainer in a dedicated PR.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major action bumps (checkout/setup-node/release-please) are handled in
      # a dedicated PR after verifying the new major in CI.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
